name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/specrun-lab/devcontainer:1
      options: --user root
    env:
      GOMODCACHE: /home/dev/go/pkg/mod
      GOCACHE: /home/dev/.cache/go-build
      GOFLAGS: -modcacherw -buildvcs=false
    steps:
      - uses: actions/checkout@v7
      - name: Levels 1–5 starten
        run: make level5
      - name: Prüfsuite
        run: make check
      - name: Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: levelboard-report
          include-hidden-files: true
          path: |
            frontend/dist/results.json
            checks/.out/playwright.json
