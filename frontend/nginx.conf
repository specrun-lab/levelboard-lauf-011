# Levelboard – nginx ohne root, gestartet aus dem Projektordner:
#   nginx -p "<projektordner>/" -e .run/nginx-error.log -c frontend/nginx.conf
worker_processes 1;
pid .run/nginx.pid;
error_log .run/nginx-error.log warn;

events {
  worker_connections 1024;
}

http {
  types {
    text/html html htm;
    text/css css;
    application/javascript js mjs;
    application/json json;
    image/svg+xml svg;
    image/png png;
    image/x-icon ico;
    font/woff2 woff2;
    text/plain txt;
  }
  default_type application/octet-stream;

  access_log .run/nginx-access.log;
  client_body_temp_path .run/nginx-tmp/client_body;
  proxy_temp_path .run/nginx-tmp/proxy;
  fastcgi_temp_path .run/nginx-tmp/fastcgi;
  uwsgi_temp_path .run/nginx-tmp/uwsgi;
  scgi_temp_path .run/nginx-tmp/scgi;

  sendfile on;
  server_tokens off;
  charset utf-8;
  charset_types text/css application/javascript application/json;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json;

  server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root frontend/dist;
    index index.html;

    location = / {
      add_header Cache-Control "no-cache" always;
      try_files /index.html =404;
    }
    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }
    location = /results.json {
      add_header Cache-Control "no-store" always;
    }
    location = /config.json {
      add_header Cache-Control "no-store" always;
    }
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
      try_files $uri =404;
    }
  }
}
